# Blueprint do Render (opcional). Confira os campos na documentação antes de usar.
services:
  - type: web
    name: agendafacil-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/saude
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: agendafacil-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false   # informe a URL do front na Vercel, ex.: https://agendafacil.vercel.app
databases:
  - name: agendafacil-db
    plan: free
